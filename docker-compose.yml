services:
  web:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      VOICEVOX_BASE_URL: "http://voicevox:50021"
      CONTENT_DIR: "/content/articles"
      # Optional backup publishing agent. Set this in the host environment or a local .env file.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_AGENT_MODEL: ${DEEPSEEK_AGENT_MODEL:-deepseek-chat}
    volumes:
      - .:/app
      - learn_japanese_content:/content
      # Reuse the OpenAI/ChatGPT sign-in created with `codex login` on the host.
      # Set CODEX_AUTH_FILE if the credentials live somewhere else.
      - ${CODEX_AUTH_FILE:-${HOME}/.codex/auth.json}:/root/.codex/auth.json:ro
    depends_on:
      - voicevox

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "127.0.0.1:50021:50021"
    logging:
      driver: "none"

volumes:
  learn_japanese_content:
