services:
  web:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      VOICEVOX_BASE_URL: "http://voicevox:50021"
      CONTENT_DIR: "/content/articles"
      # Optional for Codex Agent publishing in Docker. Local Python mode uses
      # the Codex CLI authentication already configured on the host.
      CODEX_API_KEY: "${CODEX_API_KEY:-}"
    volumes:
      - .:/app
      - learn_japanese_content:/content
    depends_on:
      - voicevox

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "127.0.0.1:50021:50021"
    logging:
      driver: "none"

volumes:
  learn_japanese_content:
