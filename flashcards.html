<main class="flashcard-shell">
    <header class="flashcard-header">
        <p class="eyebrow">N5-N3 Vocabulary</p>
        <h1>Flashcards</h1>
        <p class="intro">Study core vocabulary and article vocabulary with local progress tracking.</p>
    </header>

    <section class="study-layout" aria-label="Flashcard study">
        <aside class="study-controls" aria-label="Study controls">
            <div class="control-group">
                <label class="control-label" for="level-filter">Level</label>
                <select id="level-filter" class="select-control">
                    <option value="all">All levels</option>
                    <option value="N5">N5</option>
                    <option value="N4">N4</option>
                    <option value="N3">N3</option>
                </select>
            </div>

            <label class="checkbox-control">
                <input type="checkbox" id="due-only" checked>
                <span>Due cards only</span>
            </label>

            <div class="stat-grid" aria-live="polite">
                <div class="stat-cell">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Cards</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-value" id="stat-due">0</span>
                    <span class="stat-label">Due</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-value" id="stat-shown">0</span>
                    <span class="stat-label">Shown</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-value" id="stat-remembered">0</span>
                    <span class="stat-label">Remembered</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-value" id="stat-forgot">0</span>
                    <span class="stat-label">Forgot</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-value" id="stat-streak">0%</span>
                    <span class="stat-label">Recall</span>
                </div>
            </div>

            <div class="utility-actions">
                <button class="secondary-button" type="button" id="export-progress">Export</button>
                <label class="secondary-button file-button" for="import-progress">Import</label>
                <input class="file-input" type="file" id="import-progress" accept="application/json">
                <button class="danger-button" type="button" id="reset-progress">Reset</button>
            </div>
        </aside>

        <section class="study-panel" aria-live="polite">
            <div class="card-meta">
                <span class="level-pill" id="card-level">N5</span>
                <span id="card-source">Core vocabulary</span>
            </div>

            <div class="flashcard" id="flashcard" role="button" tabindex="0" aria-label="Reveal card answer">
                <span class="card-label">Japanese</span>
                <span class="form-pill" id="card-form" hidden></span>
                <span class="term-line">
                    <span class="card-term" id="card-term">Loading...</span>
                    <button class="icon-button speaker-button" type="button" id="pronounce-word" aria-label="Pronounce word" title="Pronounce word">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                            <path d="M16 8.5a5 5 0 0 1 0 7"></path>
                            <path d="M18.5 6a8 8 0 0 1 0 12"></path>
                        </svg>
                    </button>
                </span>
                <span class="card-reading" id="card-reading"></span>
                <span class="base-verb" id="card-base-verb" hidden></span>
                <span class="example-box" id="card-example" hidden>
                    <span class="example-meta">
                        <span>Example</span>
                        <span class="example-tools">
                            <span id="card-example-count"></span>
                            <button class="icon-button speaker-button small-speaker-button" type="button" id="pronounce-example" aria-label="Pronounce example sentence" title="Pronounce example sentence">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                                    <path d="M16 8.5a5 5 0 0 1 0 7"></path>
                                    <path d="M18.5 6a8 8 0 0 1 0 12"></path>
                                </svg>
                            </button>
                        </span>
                    </span>
                    <span class="example-ja" id="card-example-ja"></span>
                    <span class="example-en" id="card-example-en"></span>
                </span>
                <span class="card-divider" aria-hidden="true"></span>
                <span class="card-label answer-label" id="answer-label" hidden>Meaning</span>
                <span class="card-meaning" id="card-meaning" hidden></span>
            </div>

            <div class="card-actions">
                <button class="primary-button" type="button" id="reveal-card">Reveal</button>
                <button class="answer-button remember-button" type="button" id="remember-card" disabled>Yes, I remember</button>
                <button class="answer-button forgot-button" type="button" id="forgot-card" disabled>No, I don't remember</button>
            </div>

            <div class="card-footer">
                <a id="source-link" href="#" hidden>Open source article</a>
                <button class="text-button" type="button" id="skip-card">Skip</button>
            </div>

            <p class="empty-state" id="empty-state" hidden>No cards match the current filters.</p>
            <div class="pronunciation-status" id="pronunciation-status" aria-live="polite"></div>
            <audio id="flashcard-audio" hidden preload="none"></audio>
        </section>
    </section>
</main>

<script src="./assets/flashcards.js?v=a2f3438b1179"></script>
</body>
</html>
