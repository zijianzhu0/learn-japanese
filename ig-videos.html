<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Quiz Videos</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./assets/ig-videos.css?v=f87bcc4134f6">
</head>
<body>
<nav class="top-nav" aria-label="Page navigation">
    <a class="top-nav-link" href="./index.html" aria-label="Home" title="Home">
        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5"></path>
            <path d="M6.5 10.5V20h15v-9.5"></path>
            <path d="M10 20v-5h4v5"></path>
        </svg>
        <span class="icon-label">Home</span>
    </a>
    <a class="top-nav-link" href="./flashcards.html" aria-label="Flashcards" title="Flashcards">
        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h9A2.5 2.5 0 0 1 18 6.5v11A2.5 2.5 0 0 1 15.5 20h-9A2.5 2.5 0 0 1 4 17.5z"></path>
            <path d="M8 8h6"></path>
            <path d="M8 12h8"></path>
            <path d="M8 16h4"></path>
        </svg>
        <span class="icon-label">Flashcards</span>
    </a>
    <a class="top-nav-link is-current" href="./ig-videos.html" aria-label="Quiz Videos" title="Quiz videos" aria-current="page">
        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 9a3 3 0 1 1 5.4 1.8c-.8.6-1.4 1.1-1.4 2.2"></path>
            <path d="M12 17h.01"></path>
            <rect x="4" y="3" width="16" height="18" rx="2"></rect>
        </svg>
        <span class="icon-label">Quiz Videos</span>
    </a>
</nav>

<main class="quiz-workspace">
    <section class="control-panel" aria-label="Quiz video controls">
        <label class="control-field">
            <span>Story</span>
            <select id="quiz-select"></select>
        </label>

        <div class="button-row">
            <button class="primary-button" type="button" id="copy-comment">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>Copy Comment Text</span>
            </button>
            <button class="render-button" type="button" id="render-video">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
                <span>Render MP4</span>
            </button>
        </div>

        <div class="status-line" id="status-line" aria-live="polite">Loading quiz...</div>

        <section class="comment-panel" aria-label="Comment text">
            <div class="panel-heading">
                <h2>Comment Text</h2>
                <span id="answer-label"></span>
            </div>
            <textarea id="comment-text" readonly spellcheck="false"></textarea>
        </section>
    </section>

    <section class="preview-column" aria-label="Quiz video preview">
        <div class="phone-frame">
            <article class="quiz-stage" id="quiz-stage">
                <header class="stage-header">
                    <span class="stage-kicker" id="stage-kicker">Japanese Reading Quiz</span>
                    <h1 id="stage-title">What happened?</h1>
                    <span class="stage-meta" id="stage-meta">Choose one answer</span>
                </header>
                <section class="question-block">
                    <p id="quiz-question"></p>
                </section>
                <ol class="option-list" id="option-list"></ol>
                <footer class="stage-footer">
                    <span id="stage-footer-left">Read the passage in comments</span>
                    <span id="stage-footer-right">A-D</span>
                </footer>
            </article>
        </div>
    </section>
</main>

<script src="./assets/ig-videos.js?v=0b8fafc170a5"></script>
</body>
</html>
