<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG Vocabulary Videos</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./assets/ig-videos.css?v=e4d8695903d7">
</head>
<body>
<nav class="top-nav" aria-label="Page navigation">
    <a class="top-nav-link" href="./index.html" aria-label="Home" title="Home">
        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5"></path>
            <path d="M6.5 10.5V20h15v-9.5"></path>
            <path d="M10 20v-5h4v5"></path>
        </svg>
        <span class="icon-label">Home</span>
    </a>
    <a class="top-nav-link" href="./flashcards.html" aria-label="Flashcards" title="Flashcards">
        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h9A2.5 2.5 0 0 1 18 6.5v11A2.5 2.5 0 0 1 15.5 20h-9A2.5 2.5 0 0 1 4 17.5z"></path>
            <path d="M8 8h6"></path>
            <path d="M8 12h8"></path>
            <path d="M8 16h4"></path>
        </svg>
        <span class="icon-label">Flashcards</span>
    </a>
    <a class="top-nav-link is-current" href="./ig-videos.html" aria-label="IG Videos" title="IG videos" aria-current="page">
        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2"></rect>
            <path d="M9 7h6"></path>
            <path d="M9 11h6"></path>
            <path d="M9 15h4"></path>
        </svg>
        <span class="icon-label">IG Videos</span>
    </a>
</nav>

<main class="video-workspace">
    <section class="control-panel" aria-label="Video controls">
        <div class="control-row">
            <label class="control-field">
                <span>Level</span>
                <select id="level-filter">
                    <option value="all">All</option>
                    <option value="N5">N5</option>
                    <option value="N4">N4</option>
                    <option value="N3">N3</option>
                </select>
            </label>
            <label class="control-field">
                <span>Source</span>
                <select id="source-filter">
                    <option value="all">All</option>
                    <option value="core">Core</option>
                    <option value="article">Articles</option>
                </select>
            </label>
            <label class="control-field">
                <span>Voice</span>
                <select id="docker-voice">
                    <option value="9">VOICEVOX speaker 9</option>
                </select>
            </label>
        </div>

        <div class="button-row">
            <button class="icon-text-button" type="button" id="previous-set">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
                <span>Previous</span>
            </button>
            <button class="icon-text-button" type="button" id="shuffle-set">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 4 4-4 4"></path><path d="M20 7h-6a4 4 0 0 0-4 4v2"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h6a4 4 0 0 0 4-4v-2"></path></svg>
                <span>Shuffle</span>
            </button>
            <button class="icon-text-button" type="button" id="next-set">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                <span>Next</span>
            </button>
            <button class="primary-button" type="button" id="read-set">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
                <span>Read</span>
            </button>
            <button class="render-button" type="button" id="render-video">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
                <span>MP4</span>
            </button>
        </div>

        <div class="status-line" id="status-line" aria-live="polite">Loading vocabulary...</div>
    </section>

    <section class="preview-column" aria-label="IG video preview">
        <div class="phone-frame">
            <article class="ig-stage" id="ig-stage">
                <header class="stage-header">
                    <span class="stage-kicker">日本語 Vocabulary</span>
                    <h1 id="stage-title">5 words</h1>
                    <span class="stage-meta" id="stage-meta">9:16 · 1080x1920</span>
                </header>
                <ol class="word-list" id="word-list"></ol>
                <footer class="stage-footer">
                    <span>Read. Listen. Repeat.</span>
                    <span id="set-counter">Set 1</span>
                </footer>
            </article>
        </div>
    </section>
</main>

<audio id="tts-player" hidden preload="none"></audio>
<script src="./assets/ig-videos.js?v=431888ee91c8"></script>
</body>
</html>
